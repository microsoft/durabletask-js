pr: none
trigger: none

parameters:
- name: package
  displayName: Package to publish (verify before queueing)
  type: string
  default: durabletask-js
  values:
  - durabletask-js
  - durabletask-js-azuremanaged
  - azure-functions-durable

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
  pipelines:
  - pipeline: DurableTaskJSBuildPipeline
    source: durabletask-js.official
    branch: main

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: 1es-pool-azfunc
      image: 1es-ubuntu-22.04
      os: linux

    stages:
    - ${{ if eq(parameters.package, 'durabletask-js') }}:
      - stage: release_durabletask_js
        displayName: 'Release @microsoft/durabletask-js'
        jobs:
        - job: durabletask_js
          displayName: 'Release @microsoft/durabletask-js'
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              pipeline: DurableTaskJSBuildPipeline
              artifactName: drop
              targetPath: $(System.DefaultWorkingDirectory)/drop

          steps:
          - task: SFP.release-tasks.custom-build-release-task.EsrpRelease@9
            displayName: 'ESRP Release @microsoft/durabletask-js'
            inputs:
              connectedservicename: 'dtfx-internal-esrp-prod'
              usemanagedidentity: true
              keyvaultname: 'durable-esrp-akv'
              signcertname: 'dts-esrp-cert'
              clientid: '0b3ed1a4-0727-4a50-b82a-02c2bd9dec89'
              intent: 'PackageDistribution'
              contenttype: 'npm'
              contentsource: 'Folder'
              folderlocation: '$(System.DefaultWorkingDirectory)/drop/buildoutputs/durabletask-js'
              waitforreleasecompletion: true
              owners: 'wangbill@microsoft.com'
              approvers: 'kaibocai@microsoft.com'
              serviceendpointurl: 'https://api.esrp.microsoft.com'
              mainpublisher: 'durabletask-java'
              domaintenantid: '33e01921-4d64-4f8c-a055-5bdaffd5e33d'

    - ${{ if eq(parameters.package, 'durabletask-js-azuremanaged') }}:
      - stage: release_durabletask_js_azuremanaged
        displayName: 'Release @microsoft/durabletask-js-azuremanaged'
        jobs:
        - job: durabletask_js_azuremanaged
          displayName: 'Release @microsoft/durabletask-js-azuremanaged'
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              pipeline: DurableTaskJSBuildPipeline
              artifactName: drop
              targetPath: $(System.DefaultWorkingDirectory)/drop

          steps:
          - task: SFP.release-tasks.custom-build-release-task.EsrpRelease@9
            displayName: 'ESRP Release @microsoft/durabletask-js-azuremanaged'
            inputs:
              connectedservicename: 'dtfx-internal-esrp-prod'
              usemanagedidentity: true
              keyvaultname: 'durable-esrp-akv'
              signcertname: 'dts-esrp-cert'
              clientid: '0b3ed1a4-0727-4a50-b82a-02c2bd9dec89'
              intent: 'PackageDistribution'
              contenttype: 'npm'
              contentsource: 'Folder'
              folderlocation: '$(System.DefaultWorkingDirectory)/drop/buildoutputs/durabletask-js-azuremanaged'
              waitforreleasecompletion: true
              owners: 'wangbill@microsoft.com'
              approvers: 'kaibocai@microsoft.com'
              serviceendpointurl: 'https://api.esrp.microsoft.com'
              mainpublisher: 'durabletask-java'
              domaintenantid: '33e01921-4d64-4f8c-a055-5bdaffd5e33d'

    - ${{ if eq(parameters.package, 'azure-functions-durable') }}:
      - stage: release_durable_functions
        displayName: 'Release durable-functions'
        jobs:
        - job: durable_functions
          displayName: 'Release durable-functions'
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              pipeline: DurableTaskJSBuildPipeline
              artifactName: drop
              targetPath: $(System.DefaultWorkingDirectory)/drop

          steps:
          - task: SFP.release-tasks.custom-build-release-task.EsrpRelease@9
            displayName: 'ESRP Release durable-functions'
            inputs:
              connectedservicename: 'dtfx-internal-esrp-prod'
              usemanagedidentity: true
              keyvaultname: 'durable-esrp-akv'
              signcertname: 'dts-esrp-cert'
              clientid: '0b3ed1a4-0727-4a50-b82a-02c2bd9dec89'
              intent: 'PackageDistribution'
              contenttype: 'npm'
              contentsource: 'Folder'
              folderlocation: '$(System.DefaultWorkingDirectory)/drop/buildoutputs/azure-functions-durable'
              waitforreleasecompletion: true
              owners: 'wangbill@microsoft.com'
              approvers: 'kaibocai@microsoft.com'
              serviceendpointurl: 'https://api.esrp.microsoft.com'
              mainpublisher: 'durabletask-java'
              domaintenantid: '33e01921-4d64-4f8c-a055-5bdaffd5e33d'
